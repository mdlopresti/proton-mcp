[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proton-mcp"
version = "0.1.0"
description = "MCP server providing email functionality for ProtonMail via Proton Bridge"
requires-python = ">=3.12"
dependencies = [
    "mcp",
    "requests",
    "python-dotenv",
]

[project.scripts]
proton-mcp = "proton_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "UP",   # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "S101",   # assert usage (fine for this project)
    "S603",   # subprocess calls (not used)
    "S607",   # partial path to executable (not used)
]

[tool.ruff.lint.per-file-ignores]
"proton-email-server.py" = [
    "S110",   # try-except-pass in MIME parsing - intentional silent skip of malformed parts
    "S112",   # try-except-continue in MIME parsing - same reason
    "S113",   # requests timeout - we set timeouts explicitly
]
"src/proton_mcp/clients/imap.py" = [
    "S110",   # try-except-pass in cleanup - intentional best-effort disconnect
]
"src/proton_mcp/utils/mime.py" = [
    "S110",   # try-except-pass in MIME parsing - intentional
    "S112",   # try-except-continue in MIME parsing - intentional
]
"tests/**/*.py" = [
    "S105",   # hardcoded passwords in test fixtures
    "S108",   # hardcoded /tmp in test data
]

[tool.bandit]
exclude_dirs = ["venv", ".venv", "tests"]
skips = [
    "B101",   # assert usage (fine for this project)
    "B110",   # try-except-pass in MIME parsing - intentional
    "B112",   # try-except-continue in MIME parsing - intentional
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/proton_mcp"]
omit = [
    "proton-email-server.py",
    "src/proton_mcp/__main__.py",
    "src/proton_mcp/tools/*",
    "src/proton_mcp/resources/*",
    "src/proton_mcp/prompts/*",
]

[tool.coverage.report]
exclude_lines = [
    "raise NotImplementedError",
]
